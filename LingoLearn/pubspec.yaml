name: lingolearn
description: "A Flutter language learning app for practicing vocabulary, phrases, quizzes, and learning progress."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  flutter_tts: ^4.2.0
  speech_to_text: ^7.4.0
  http: ^1.6.0
  audioplayers: ^6.7.1
  record: ^6.2.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true




